# =============================================================================
# Track B Configuration — VideoMAE Ego (In-Domain Egocentric)
# =============================================================================
# This configuration uses the VideoMAE encoder pretrained on egocentric clips.
# Requires running VideoMAE pretraining first:
#   python -m trackB.videomae.videomae_pretrain --epochs 100
#
# Usage:
#   python -m trackB.trackB_train_loader --config trackB_videomae_ego

# Inherit from main trackB config
_base_: "trackB.yaml"

# Override model settings for VideoMAE
model:
  tokenizer:
    # In-domain egocentric 3D video backbone
    video_backbone: "videomae_ego"

    # VideoMAE requires 16 frames input (matching pretrained model)
    time_len: 16
    # Options:
    # - 8   # shorter window (only if your encoder/tokenizer supports it)
    # - 16  # default for VideoMAE configs in this repo
    # - 32  # longer context (heavier)

    # VideoMAE encoder settings
    videomae:
      # HuggingFace model name (use one of these):
      #   - "MCG-NJU/videomae-base"           (ViT-B, 768d, default)
      #   - "MCG-NJU/videomae-large"          (ViT-L, 1024d)
      #   - "MCG-NJU/videomae-huge"           (ViT-H, 1280d)
      #   - "MCG-NJU/videomae-base-finetuned-kinetics"
      #   - "MCG-NJU/videomae-large-finetuned-kinetics"
      hf_model_name: "MCG-NJU/videomae-base"
      # Options:
      # - "MCG-NJU/videomae-base"                 # 768d
      # - "MCG-NJU/videomae-large"                # 1024d
      # - "MCG-NJU/videomae-huge"                 # 1280d
      # - "MCG-NJU/videomae-base-finetuned-kinetics"  # alternate starting point

      # Custom weights path (overrides hf_model_name if exists)
      weights_path: "${paths.local_extraction}/videomae_local_part/checkpoints_ego_scratch/videomae_ego_scratch_last.pt"
      # Options:
      # - null  # use HF weights only
      # - "${paths.local_extraction}/videomae_local_part/checkpoints_ego_scratch/videomae_ego_scratch_last.pt"  # default in this repo
      # - "${paths.local_extraction}/videomae_local_part/checkpoints_ego_scratch/videomae_ego_scratch_best.pt"  # best checkpoint (if saved)

      patch_size: 16
      tubelet_size: 2
      num_frames: 16  # Must match pretrained model
      embed_dim: 768  # 768 for base, 1024 for large, 1280 for huge
      # Options:
      # - 768   # base
      # - 1024  # large
      # - 1280  # huge
      depth: 12
      num_heads: 12
      freeze_encoder: true  # Freeze encoder weights during downstream training
      # Options:
      # - true   # default
      # - false  # fine-tune encoder (heavy)

  # VideoMAE encoder output is 768-dim
  projector:
    in_dim: 768
    out_dim: 256

# -----------------------------------------------------------------------------
# Training Configuration (VideoMAE-specific adjustments)
# -----------------------------------------------------------------------------
training:
  # Hyperparameters
  epochs: 30
  batch_size: 8
  lr: 3.0e-4           # Slightly lower LR for pretrained features
  # Options:
  # - 3.0e-4  # safer for fine-tuning
  # - 5.0e-4  # common for VideoMAE features
  # - 1.0e-3  # current
  min_lr: 1.0e-5
  warmup_epochs: 1.0   # Longer warmup for new backbone
  # Options:
  # - 0.0  # no warmup
  # - 1.0  # default
  # - 2.0  # safer for fine-tuning

  # Regularization
  label_smoothing: 0.10
  weight_decay: 0.05

  # Data
  candidate_limit: 16
  normalize_ttc: true

  # Checkpointing
  save_epoch_checkpoints: true
  save_best_checkpoint: true

  # Early stopping
  early_stopping:
    enabled: true
    patience: 7
    monitor: "mAP"
    mode: "max"

  # Evaluation
  eval_every: 1

  # Mixed precision (enable for GPU speedup)
  amp: false

# -----------------------------------------------------------------------------
# Demo Mode Configuration
# -----------------------------------------------------------------------------
demo:
  enabled: false
  steps: 10
  variant: "loader"
  use_real_labels: true

# Training note
_note: |
  This is the ego-only VideoMAE configuration:
  - Uses VideoMAE encoder pretrained on egocentric STA clips
  - Self-supervised pretraining with masked autoencoding
  - 3D spatiotemporal token extraction (vs 2D per-frame in baseline)
  - This represents the "in-domain egocentric" approach in the thesis

  Prerequisites:
  1. Run VideoMAE pretraining first:
     python -m trackB.videomae.videomae_pretrain --epochs 100
  2. Verify encoder checkpoint exists:
     videomae_local_part/checkpoints_ego_scratch/videomae_ego_scratch_last.pt

# -----------------------------------------------------------------------------
# Data Sources - Pre-extracted VideoMAE tokens for fast training
# -----------------------------------------------------------------------------
data:
  # Pre-extracted VideoMAE tokens (encoder output) for ~50x faster training
  # Generated by: python build_trackB_videomae_tokens.py
  # Options:
  #   - videomae_trackB_tokens/tokens (HuggingFace base model)
  #   - videomae_trackB_tokens_scratch/tokens (your ego-scratch trained model)
  tokens_root: "videomae_trackB_tokens_scratch/tokens"
  # Options:
  # - "videomae_trackB_tokens/tokens"          # HF base tokens
  # - "videomae_trackB_tokens_scratch/tokens"  # ego-scratch tokens
  # - null  # on-the-fly tokenization (slow)
