# =============================================================================
# Track B Configuration — ResNet18 Baseline (Exo-Transfer)
# =============================================================================
# This is the baseline configuration using web-pretrained 2D ResNet18 backbone.
# Use for comparison against the Ego-VideoMAE variant.
#
# Usage:
#   python -m trackB.trackB_train_loader --config trackB_resnet18_baseline

# Inherit from main trackB config
_base_: "trackB.yaml"

# Override model settings for baseline
model:
  tokenizer:
    # Exocentric/web-pretrained 2D backbone
    video_backbone: "resnet18"
    backbone: "resnet18"
    pretrained: true
    freeze_backbone: true
  
  # ResNet18 layer4 output is 512-dim
  projector:
    in_dim: 512
    out_dim: 256

# Training note
_note: |
  This is the exo-transfer baseline configuration:
  - Uses ImageNet-pretrained ResNet18 as the visual backbone
  - Per-frame encoding with temporal fusion via FGTP
  - This represents the "exocentric transfer" approach in the thesis
