# =============================================================================
# Ego4D-LiteSTA Base Configuration
# =============================================================================
# This file contains shared settings across all tracks.
# Override in track-specific configs or via CLI/environment variables.

# Version and data roots
version: "v2"
# Options (pick the one that matches your prepared assets):
# - "v2"  # default in this repo; most pipelines/docs assume v2 assets exist
# - "v1"  # use only if you actually built/extracted v1 frames/labels/manifests
# - "v2_small"  # if you maintain a smaller dev subset under local_extraction/v2_small/

paths:
  # Base paths (relative to repo root or absolute)
  repo_root: "."
  local_extraction: "local_extraction"

  # Data directories
  frames_root: "${paths.local_extraction}/${version}/extracted_frames"
  # Options:
  # - "${paths.local_extraction}/${version}/extracted_frames"  # default extracted frames
  # - "${paths.local_extraction}/${version}/extracted_frames_540"  # if you keep height-540 frames separately
  # - "${paths.local_extraction}/${version}/extracted_frames_debug"  # tiny subset for fast iteration

  labels_root: "${paths.local_extraction}/${version}/yolo_labels_540"
  # Options:
  # - "${paths.local_extraction}/${version}/yolo_labels_540"  # labels aligned to 540p frames
  # - "${paths.local_extraction}/${version}/yolo_labels"  # if labels were generated at native resolution
  # - "${paths.local_extraction}/${version}/yolo_labels_debug"  # small QA/debug labels

  manifests_root: "${paths.local_extraction}/${version}/manifests"
  # Options:
  # - "${paths.local_extraction}/${version}/manifests"  # default
  # - "${paths.local_extraction}/${version}/manifests_clip"  # if you maintain CLIP-augmented manifests separately
  # - "${paths.local_extraction}/${version}/manifests_debug"  # tiny subset for fast iteration

  org_annotations: "${paths.local_extraction}/${version}/org_annotations"

  # Run outputs
  runs_root: "${paths.local_extraction}/runs"

  # Colab-specific overrides (set via environment or runtime)
  colab_drive_root: "/content/drive/MyDrive/ego4d_data"
  colab_local_root: "/content"

# Runtime environment detection
runtime:
  auto_detect_colab: true
  device: "auto"  # 'auto', 'cuda', 'cpu'
  # Options:
  # - "auto"  # easiest; uses CUDA if available
  # - "cuda"  # force GPU (fails if CUDA not available)
  # - "cpu"   # force CPU for portability/debugging

  num_workers: 0
  # Options:
  # - 0   # safest on Windows / when dataset holds model references
  # - 2   # small speedup if IO-heavy and code supports it
  # - 4   # faster prefetching, higher RAM usage

  pin_memory: false
  # Options:
  # - false  # default; safe
  # - true   # can speed GPU dataloading (only helps when using CUDA + DataLoader workers)

  use_half: false
  # Options:
  # - false  # default; safest numerically
  # - true   # FP16 in some tokenizers/models (faster, but can be unstable)

# Logging
logging:
  level: "DEBUG"
  # Options:
  # - "DEBUG"  # maximum detail for troubleshooting
  # - "INFO"   # default
  # - "WARNING"  # quieter logs
  # - "ERROR"  # only errors

  print_progress: true
  use_tqdm: true

# Demo/debug mode (shared across all tracks)
demo:
  enabled: false
  # Options:
  # - true   # run tiny subset paths
  # - false  # normal
  max_samples: 50
  # Options:
  # - 10   # very quick demo
  # - 50   # default
  # - 200  # heavier demo

# Reproducibility
seed: 42
# Options:
# - 0    # common baseline seed
# - 42   # default
# - 123  # alternate seed for robustness checks

deterministic: true
# Options:
# - true   # more reproducible, sometimes slower
# - false  # faster, but results vary more run-to-run
